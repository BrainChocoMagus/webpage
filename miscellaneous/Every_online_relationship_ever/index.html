<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Ghosted · A Digital Haunting</title>
    <style>
        /* ================================================================
           FULLY RESPONSIVE DISCORD-STYLE CSS + PROFILE UI + VISUAL DECAY
        ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0b10;
            font-family: system-ui, 'Segoe UI', 'Whitney', 'Inter', -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            height: 98vh;
            max-height: 98vh;
            background: #1e1f2c;
            border-radius: 24px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            flex-direction: row;
        }

        /* ========= LEFT SIDEBAR ========= */
        .sidebar-server {
            width: 68px;
            background: #111214;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 12px;
            overflow-y: auto;
            border-right: 1px solid #2b2d3a;
            flex-shrink: 0;
        }

        .server-icon {
            width: 44px;
            height: 44px;
            background: #2c2d3a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            color: #dbdee1;
            text-decoration: none;
        }

        .server-icon.active {
            border-radius: 16px;
            background: #5865f2;
        }

        /* ========= CHANNEL SIDEBAR ========= */
        .channel-sidebar {
            width: 220px;
            background: #1e1f2c;
            display: flex;
            flex-direction: column;
            padding: 14px 6px;
            border-right: 1px solid #2b2d3a;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .channel-category {
            font-size: 11px;
            font-weight: 600;
            color: #8e9297;
            margin: 12px 0 4px 10px;
            letter-spacing: 0.5px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            margin: 2px 4px;
            border-radius: 8px;
            color: #96989d;
            cursor: pointer;
            font-size: 14px;
            transition: 0.1s;
        }

        .channel-item.active {
            background: #393c49;
            color: white;
        }

        /* ========= MAIN CHAT AREA with dynamic decay classes ========= */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #313338;
            overflow: hidden;
            min-width: 0;
            transition: background 0.4s ease, filter 0.3s ease;
        }

        /* DECAY STAGES — grimy/sad visual effects applied to chat-main */
        .chat-main.decay-stage1 {
            background: #2a2b30;
        }
        .chat-main.decay-stage2 {
            background: #222328;
            filter: contrast(0.95) brightness(0.92);
        }
        .chat-main.decay-stage3 {
            background: #1a1b1f;
            filter: contrast(0.9) brightness(0.88) grayscale(0.1);
        }
        .chat-main.decay-stage4 {
            background: #111217;
            filter: contrast(0.85) brightness(0.8) grayscale(0.2) sepia(0.05);
        }

        /* Optional grain overlay (pseudo-element for grime) */
        .chat-main.decay-stage3::before,
        .chat-main.decay-stage4::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="1" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.04"/></svg>');
            background-repeat: repeat;
            opacity: 0.25;
            z-index: 0;
            border-radius: inherit;
        }

        .chat-header {
            background: #2b2d31;
            border-bottom: 1px solid #1e1f22;
            padding: 12px 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            z-index: 2;
            position: relative;
        }

        /* Profile UI (Discord-like) */
        .profile-area {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #232428;
            padding: 6px 12px 6px 8px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.1s;
        }
        .profile-area:hover {
            background: #2c2f34;
        }
        .profile-avatar {
            position: relative;
            width: 36px;
            height: 36px;
        }
        .profile-avatar-img {
            width: 100%;
            height: 100%;
            background: #9b59b6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: filter 0.3s, opacity 0.3s;
        }
        .status-dot {
            position: absolute;
            bottom: 0px;
            right: 0px;
            width: 11px;
            height: 11px;
            background: #23a55a;
            border-radius: 50%;
            border: 2px solid #232428;
            transition: background 0.2s;
        }
        .profile-info {
            display: flex;
            flex-direction: column;
        }
        .profile-name {
            font-weight: 600;
            color: white;
            font-size: 14px;
            line-height: 1.2;
        }
        .profile-badge {
            font-size: 10px;
            color: #b5bac1;
        }
        .profile-about {
            font-size: 10px;
            color: #a5a9b0;
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-info {
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .controls-group {
            display: flex;
            gap: 8px;
            background: #1e1f22;
            padding: 4px 12px;
            border-radius: 40px;
            flex-wrap: wrap;
            align-items: center;
        }

        .ctrl-btn {
            background: #2b2d31;
            border: none;
            color: #e1e3e8;
            cursor: pointer;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 24px;
            font-weight: 500;
            transition: 0.1s;
            white-space: nowrap;
        }

        .color-palette {
            display: flex;
            gap: 6px;
            margin-left: 4px;
        }
        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-dot.active {
            border-color: white;
            transform: scale(1.1);
        }

        /* messages container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        .message {
            animation: fadeIn 0.2s ease;
        }
        .message.system {
            text-align: center;
            font-style: italic;
            font-size: 12px;
            color: #a5a9b0;
            margin: 6px 0;
        }
        .message-row {
            display: flex;
            gap: 10px;
        }
        .avatar {
            width: 38px;
            height: 38px;
            background: #5865f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 15px;
            flex-shrink: 0;
            transition: filter 0.3s, opacity 0.3s;
        }
        .message-content {
            flex: 1;
        }
        .username {
            font-weight: 600;
            color: white;
            font-size: 14px;
        }
        .timestamp {
            font-size: 10px;
            color: #8e9297;
            margin-left: 8px;
        }
        .message-text {
            color: #dbdee1;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
            transition: all 0.2s;
        }

        /* WOBBLE */
        .wobbly-text .message-text {
            display: inline-block;
            animation: wobbleAnim 0.35s infinite ease;
        }
        @keyframes wobbleAnim {
            0% { transform: translate(0,0) rotate(0deg);}
            25% { transform: translate(1px, -0.8px) rotate(0.5deg);}
            75% { transform: translate(-0.7px, 0.6px) rotate(-0.4deg);}
            100% { transform: translate(0,0);}
        }

        .zoom-small .message-text { font-size: 11px; }
        .zoom-normal .message-text { font-size: 14px; }
        .zoom-large .message-text { font-size: 18px; }
        .zoom-xlarge .message-text { font-size: 24px; }

        .chat-input-area {
            background: #2b2d31;
            padding: 10px 12px;
            border-top: 1px solid #1e1f22;
            z-index: 2;
            position: relative;
        }
        .input-wrapper {
            background: #383a40;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 6px 14px;
            gap: 8px;
        }
        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        .send-btn {
            background: #5865f2;
            border: none;
            color: white;
            border-radius: 30px;
            padding: 6px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .commentary-panel {
            font-size: 10px;
            background: #232428;
            margin-top: 8px;
            padding: 5px 10px;
            border-radius: 20px;
            color: #b5bac1;
            text-align: center;
        }
        .ghost-effect {
            opacity: 0.5;
            filter: blur(0.8px);
            transition: 0.2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* Profile drawer (modal-like) */
        .profile-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 320px;
            max-width: 85vw;
            height: 100%;
            background: #1e1f2c;
            box-shadow: -4px 0 20px rgba(0,0,0,0.5);
            z-index: 1000;
            transition: right 0.2s ease;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-left: 1px solid #2b2d3a;
        }
        .profile-drawer.open {
            right: 0;
        }
        .drawer-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            align-self: flex-end;
        }
        .drawer-avatar {
            width: 80px;
            height: 80px;
            background: #9b59b6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto;
        }
        .drawer-name {
            text-align: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        .drawer-bio {
            background: #2b2d31;
            padding: 12px;
            border-radius: 12px;
            color: #b5bac1;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .channel-sidebar { width: 160px; }
            .sidebar-server { width: 56px; }
            .server-icon { width: 38px; height: 38px; font-size: 1rem; }
            .profile-area .profile-info .profile-about { display: none; }
            .profile-area { padding: 4px 8px; }
        }
        @media (max-width: 550px) {
            .channel-sidebar { display: none; }
            .sidebar-server { width: 48px; }
            .chat-header { flex-direction: column; align-items: flex-start; }
        }
        .dev-only { display: none; }
        ::-webkit-scrollbar { width: 4px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar-server">
        <div class="server-icon active">💔</div>
        <a href="https://brainchocomagus.space/" class="server-icon">🌙</a>
        <a href="https://brainchocomagus.space/GhostThoughts/GhostThoughtv1.html" class="server-icon">👻</a>
    </div>

    <div class="channel-sidebar">
        <div class="channel-category">✦ NARRATIVE</div>
        <div class="channel-item active" data-channel="main"># 💬 general</div>
        <div class="channel-item" data-channel="echoes"># 💖 lulu-loves-you</div>
        <div class="channel-category">⚙️ CONTROLS</div>
        <div class="channel-item" id="resetStoryBtn">🔄 reset story</div>
    </div>

    <div class="chat-main" id="chatMain">
        <div class="chat-header">
            <div class="channel-info">
                <span># 💬 ghost-diaries · </span><span style="font-size:12px;">the ghosting simulation</span>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <div class="profile-area" id="profileTrigger">
                    <div class="profile-avatar">
                        <div class="profile-avatar-img" id="partnerAvatar">🌙</div>
                        <div class="status-dot" id="statusDot"></div>
                    </div>
                    <div class="profile-info">
                        <div class="profile-name" id="profileName">starlight</div>
                        <div class="profile-about" id="profileAbout">i love late night talks ✨</div>
                    </div>
                </div>
                <div class="controls-group">
                    <button class="ctrl-btn" id="zoomToggle">🔍 Zoom</button>
                    <div class="color-palette" id="colorPalette">
                        <div class="color-dot" style="background:#dbdee1" data-color="default"></div>
                        <div class="color-dot" style="background:#f5a97f" data-color="#f5a97f"></div>
                        <div class="color-dot" style="background:#eb6f9e" data-color="#eb6f9e"></div>
                        <div class="color-dot" style="background:#8aadf4" data-color="#8aadf4"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer"></div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Type something... (ghosting activates soon)">
                <button class="send-btn" id="sendMsgBtn">Send</button>
            </div>
            <div class="commentary-panel" id="commentaryBox">💡 Tip: Zoom & Color work. Ghosting triggers after ~10 messages or keywords.</div>
        </div>
    </div>
</div>

<!-- Profile Drawer -->
<div id="profileDrawer" class="profile-drawer">
    <button class="drawer-close" id="closeDrawer">✕</button>
    <div class="drawer-avatar" id="drawerAvatar">🌙</div>
    <div class="drawer-name" id="drawerName">starlight</div>
    <div class="drawer-bio" id="drawerBio">💫 passionate about stars and staying close</div>
    <div id="drawerStatusText" style="color:#b5bac1; font-size:12px; text-align:center;">🟢 Online</div>
</div>

<script>
    // ---------- AI CONFIG ----------
    const warmResponses = [
        "💕 i love talking to you. you just get me, y'know?",
        "🌙 i was waiting for your message... it's the highlight of my day.",
        "✨ promise you won't disappear? everyone leaves eventually...",
        "🌸 i feel safe when we chat. it's like we're in our own little world.",
        "💖 don't ghost me, okay? that would shatter me.",
        "⭐ you're so different from others online. i'm scared to lose this.",
        "🌟 every notification from you makes me smile.",
        "💫 i wish we could meet irl someday. you're special.",
        "you make me smile",
        "I love you so much",
    ];
    const ghostResponses = [
        "oh. okay.",
        "👍",
        "sorry, been busy.",
        "i don't know what to say anymore.",
        "...",
        "seen",
        "maybe we need a break.",
        "i'm not in the right headspace.",
        "       ",
        "i'll text later (ghosts)",
        "k.",
        "👍 cool i guess",
        "i need some space right now.",
        "Lol",
        "We spoke for hours, I gave you so much priority already"
    ];
    const specialKeywords = [
        { keyword: "ghost", response: "please don't say that... it's happening, isn't it?", phase: "warm" },
        { keyword: "ghost", response: "see? you noticed. i'm fading. i'm sorry.", phase: "ghost" },
        { keyword: "sorry", response: "it's not your fault. maybe i'm just broken.", phase: "ghost" },
        { keyword: "miss you", response: "i miss the old us too... but something changed.", phase: "ghost" },
        { keyword: "hello", response: "hey... nice to hear from you again 💫", phase: "warm" },
        { keyword: "leave", response: "everyone leaves eventually. maybe it's my turn.", phase: "ghost" },
        { keyword: "love", response: "i think i'm falling for you... and that scares me.", phase: "warm" },
        { keyword: "love", response: "I am yours", phase: "warm" },
        { keyword: "love", response: "i used to feel that way. now i don't know anymore.", phase: "ghost" },
        { keyword: "love", response: "I dont think we can be really together.", phase: "ghost" }
    ];
    
    // STATE
    let messageCount = 0;
    let ghostActive = false;
    let ghostIntensity = 0;
    let currentZoomIndex = 1;
    const zoomLevels = ['zoom-small', 'zoom-normal', 'zoom-large', 'zoom-xlarge'];
    let currentColor = '#dbdee1';
    
    // DOM
    const msgContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendMsgBtn');
    const zoomBtn = document.getElementById('zoomToggle');
    const resetBtn = document.getElementById('resetStoryBtn');
    const commentaryDiv = document.getElementById('commentaryBox');
    const chatMain = document.getElementById('chatMain');
    const profileTrigger = document.getElementById('profileTrigger');
    const profileDrawer = document.getElementById('profileDrawer');
    const closeDrawer = document.getElementById('closeDrawer');
    const partnerAvatarImg = document.getElementById('partnerAvatar');
    const statusDot = document.getElementById('statusDot');
    const profileAboutSpan = document.getElementById('profileAbout');
    const profileNameSpan = document.getElementById('profileName');
    const drawerAvatar = document.getElementById('drawerAvatar');
    const drawerName = document.getElementById('drawerName');
    const drawerBio = document.getElementById('drawerBio');
    const drawerStatusText = document.getElementById('drawerStatusText');
    
    // Helper functions
    function setCommentary(msg, isImportant = false) {
        commentaryDiv.innerHTML = `💬 ${msg}`;
        commentaryDiv.style.background = isImportant ? "#2c2b33" : "#232428";
    }
    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'; }); }
    
    function addMessage(username, text, isSystem = false, isGhostly = false, customTime = null) {
        const div = document.createElement('div');
        div.className = 'message';
        if (isSystem) div.classList.add('system');
        const time = customTime || new Date().toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
        if (isSystem) {
            div.innerHTML = `<div class="message-text" style="color:#b9bbbe; text-align:center;">✦ ${escapeHtml(text)} — ${time}</div>`;
        } else {
            const avatarIcon = username === 'You' ? '🐱' : '🌙';
            const avatarBg = username === 'You' ? '#4e5058' : '#9b59b6';
            div.innerHTML = `<div class="message-row"><div class="avatar" style="background: ${avatarBg};">${avatarIcon}</div><div class="message-content"><div class="message-header"><span class="username">${escapeHtml(username)}</span><span class="timestamp">${time}</span></div><div class="message-text" style="color: ${currentColor};">${escapeHtml(text)}</div></div></div>`;
        }
        msgContainer.appendChild(div);
        if (isGhostly && !isSystem) div.classList.add('ghost-effect');
        msgContainer.scrollTop = msgContainer.scrollHeight;
        return div;
    }
    
    // UPDATE VISUAL DECAY & PROFILE (grimy + status changes)
    function updateDecayAndProfile() {
        // remove existing decay classes
        chatMain.classList.remove('decay-stage1', 'decay-stage2', 'decay-stage3', 'decay-stage4');
        if (!ghostActive) {
            // warm
            statusDot.style.background = "#23a55a";
            drawerStatusText.innerText = "🟢 Online";
            profileAboutSpan.innerText = "i love late night talks ✨";
            drawerBio.innerText = "💫 passionate about stars and staying close";
            partnerAvatarImg.style.filter = "none";
            partnerAvatarImg.style.opacity = "1";
            return;
        }
        // ghost intensity based decay
        let stage = Math.floor(ghostIntensity / 3); // 0-4 stages
        if (stage >= 1) {
            chatMain.classList.add('decay-stage1');
            statusDot.style.background = "#f0b232";
            drawerStatusText.innerText = "🟠 Idle";
            profileAboutSpan.innerText = "been busy...";
            drawerBio.innerText = "needs some space.";
        }
        if (stage >= 2) {
            chatMain.classList.add('decay-stage2');
            statusDot.style.background = "#80848e";
            drawerStatusText.innerText = "⚫ Offline";
            profileAboutSpan.innerText = "last seen: ages ago";
            drawerBio.innerText = "this account is inactive";
            partnerAvatarImg.style.filter = "grayscale(0.3)";
        }
        if (stage >= 3) {
            chatMain.classList.add('decay-stage3');
            drawerStatusText.innerText = "⚫ Offline · vanished";
            profileAboutSpan.innerText = "........................................";
            drawerBio.innerText = "User not accepting messages";
            partnerAvatarImg.style.filter = "grayscale(0.7) blur(0.5px)";
        }
        if (stage >= 4) {
            chatMain.classList.add('decay-stage4');
            drawerStatusText.innerText = "💀 Ghosted";
            profileAboutSpan.innerText = "memories only";
            drawerBio.innerText = "They faded into silence";
            partnerAvatarImg.style.filter = "grayscale(1) blur(1px) opacity(0.7)";
            messageInput.placeholder = "They won't reply...";
        }
    }
    
    function getAIResponse(userMsg, isGhostMode) {
        const lowerMsg = userMsg.toLowerCase();
        for (let spec of specialKeywords) {
            if (lowerMsg.includes(spec.keyword)) {
                if ((spec.phase === "warm" && !isGhostMode) || (spec.phase === "ghost" && isGhostMode))
                    return spec.response;
            }
        }
        if (!isGhostMode) return warmResponses[Math.floor(Math.random() * warmResponses.length)];
        let pool = [...ghostResponses];
        if (ghostIntensity > 5) pool.push("(left on read)", "💀 silence...", "user is offline for 3 days");
        return pool[Math.floor(Math.random() * pool.length)];
    }
    
    function onUserMessage(rawMsg) {
        if (!rawMsg.trim()) return;
        addMessage("You", rawMsg.trim());
        messageCount++;
        setCommentary(`Message #${messageCount}: ${ghostActive ? '👻 ghost mode active' : '💗 warm phase'}`);
        
        if (!ghostActive && (messageCount >= 10 || rawMsg.toLowerCase().includes('ghost') || rawMsg.toLowerCase().includes('leave') || rawMsg.toLowerCase().includes('alone'))) {
            ghostActive = true;
            addMessage(null, "💀 Something shifted — the replies turn cold. Ghosting begins...", true);
            setCommentary("⚠️ GHOSTING TRIGGERED! UI becomes grimy and profile decays.", true);
            setTimeout(() => { addMessage("☁️ starlight", "hey... sorry i've been distant. i don't know what's wrong with me.", false, true); }, 400);
            updateDecayAndProfile();
        }
        setTimeout(() => {
            if (ghostActive) ghostIntensity = Math.min(ghostIntensity + 0.45, 12);
            const aiReply = getAIResponse(rawMsg, ghostActive);
            addMessage("☁️ starlight", aiReply, false, ghostActive);
            if (ghostActive && ghostIntensity > 5 && Math.random() < 0.3) addMessage(null, "⏳ last online: ages ago. The silence screams.", true);
            if (ghostActive && ghostIntensity > 8 && !document.querySelector('.final-void')) {
                addMessage(null, "👻 They've become a ghost. Your words echo in an empty server.", true);
                document.querySelectorAll('.message').forEach(msg => { if (msg.innerHTML.includes('☁️ starlight')) msg.classList.add('ghost-effect'); });
            }
            updateDecayAndProfile();
        }, 480);
    }
    
    function initDefaultStory() {
        msgContainer.innerHTML = '';
        messageCount = 0;
        ghostActive = false;
        ghostIntensity = 0;
        updateDecayAndProfile();
        addMessage("☁️ starlight", "hey! i'm so happy we met. you seem like a real one ✨", false, false, "7:21 PM");
        addMessage("You", "aww thank you! i feel the same way, you're so easy to talk to 💫", false, false, "7:23 PM");
        addMessage("☁️ starlight", "i've been ghosted before... it hurts. promise you won't disappear?", false, false, "7:26 PM");
        addMessage("You", "i promise. i'll always be here for you. 🌸", false, false, "7:28 PM");
        addMessage(null, "💬 The fragile glow of a new connection. But ghosts hide in the wires...", true, false, "7:30 PM");
        setCommentary("Story reset. Ghosting happens after ~10 messages or keywords like 'ghost'.");
    }
    
    function resetGame() { initDefaultStory(); setCommentary("🔄 Timeline reset. Visuals restored."); }
    
    // UI functions
    function applyZoom() {
        msgContainer.classList.remove(...zoomLevels);
        msgContainer.classList.add(zoomLevels[currentZoomIndex]);
        const names = ['Small', 'Normal', 'Large', 'XLarge'];
        zoomBtn.innerText = `🔍 ${names[currentZoomIndex]}`;
    }
    function cycleZoom() { currentZoomIndex = (currentZoomIndex + 1) % 4; applyZoom(); }
    function setColor(color) { currentColor = color; document.querySelectorAll('.message-text').forEach(el => { if (!el.closest('.system')) el.style.color = color; }); setCommentary(`🎨 color changed`); }
    
    // Profile Drawer
    profileTrigger.addEventListener('click', () => { profileDrawer.classList.add('open'); });
    closeDrawer.addEventListener('click', () => { profileDrawer.classList.remove('open'); });
    
    // Event Listeners
    sendBtn.addEventListener('click', () => { let v = messageInput.value; if(v.trim()){ onUserMessage(v); messageInput.value = ''; } });
    messageInput.addEventListener('keypress', (e) => { if(e.key === 'Enter'){ e.preventDefault(); let v = messageInput.value; if(v.trim()){ onUserMessage(v); messageInput.value = ''; } } });
    zoomBtn.addEventListener('click', cycleZoom);
    resetBtn.addEventListener('click', resetGame);
    
    const dots = document.querySelectorAll('.color-dot');
    dots.forEach(dot => dot.addEventListener('click', () => {
        dots.forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        let col = dot.getAttribute('data-color');
        if(col === 'default') col = '#dbdee1';
        setColor(col);
    }));
    document.querySelector('.color-dot[data-color="default"]').classList.add('active');
    
    document.querySelectorAll('.channel-item[data-channel]').forEach(ch => {
        ch.addEventListener('click', () => {
            document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
            ch.classList.add('active');
            if(ch.getAttribute('data-channel') === 'echoes') addMessage(null, "📜 echoes: 'i'll never ghost' — but they're gone", true);
        });
    });
    
    initDefaultStory();
    
    document.addEventListener('keydown', (e) => {
        if(e.ctrlKey && e.shiftKey && e.key === 'D') {
            console.clear();
            console.log("warmResponses:", warmResponses, "ghostResponses:", ghostResponses);
            setCommentary("Dev menu: check console (F12)", true);
        }
    });
</script>
</body>
</html>
