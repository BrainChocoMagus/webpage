<div class="sidebar-server">

<div class="server-icon">👻</div>
</div>

<div class="channel-sidebar">
# ghost-diaries
</div>

<div class="chat-main">

<div class="chat-header">

<div># ghost-diaries</div>

<!-- MINI PROFILE -->
<div class="profile-mini">
<img id="avatarPreview" src="https://i.imgur.com/6VBx3io.png">
<input id="nameInput" placeholder="name">
<input id="avatarInput" placeholder="url">
<button id="updateProfileBtn">ok</button>
</div>

</div>

<div class="messages-container" id="messagesContainer"></div>

<div class="chat-input-area">
<div class="input-wrapper">
<input id="messageInput">
<button id="sendBtn">Send</button>
</div>
</div>

<!-- SCENES -->
<div id="memoryScene" class="scene-overlay">
<h1>🌙 memory fragment</h1>
<p id="memoryText"></p>
<button onclick="closeScene()">return</button>
</div>

<div id="voidScene" class="scene-overlay">
<h1>👻 no response</h1>
<button onclick="location.reload()">restart</button>
</div>

</div>
</div>

<script>

/* ===== CHARACTER ===== */
let character={
name:"☁️ starlight",
avatar:"🌙",
mood:0,
attachment:5,
instability:0
};

/* ===== PROFILE EDIT ===== */
updateProfileBtn.onclick=()=>{
let n=nameInput.value;
let a=avatarInput.value;
if(n) character.name=n;
if(a){
character.avatar=a;
avatarPreview.src=a;
}
};

/* ===== MESSAGE ===== */
function addMessage(user,text){
let div=document.createElement('div');
div.className="message";

let avatar=user==="You"?"🐱":character.avatar;

div.innerHTML=`
<div class="message-row">
<div class="avatar">${avatar}</div>
<div>
<b>${user==="You"?"You":character.name}</b>
<div class="message-text">${text}</div>
</div>
</div>`;

messagesContainer.appendChild(div);
messagesContainer.scrollTop=99999;
}

/* ===== ANALYSIS ===== */
function analyze(t){
t=t.toLowerCase();

if(t.includes("love")) character.attachment++;
if(t.includes("leave")) character.mood--;
if(t.includes("why")) character.instability+=1;

character.instability+=0.3;
}

/* ===== SCENES ===== */
function openScene(id){
document.getElementById(id).classList.add('active');
}
function closeScene(){
document.querySelectorAll('.scene-overlay')
.forEach(s=>s.classList.remove('active'));
}

/* ===== AI ===== */
function aiResponse(msg){

// glitch
if(character.instability>5)
document.body.classList.add("glitch");

// memory
if(character.instability>8 && Math.random()<0.5){
openScene("memoryScene");
memoryText.innerText="you said you'd stay...";
}

// void
if(character.instability>12){
openScene("voidScene");
}

// gaslight
if(character.instability>6 && Math.random()<0.4){
return "you already said that.";
}

// identity break
if(character.instability>10){
character.name="???";
}

// normal states
if(character.mood>2) return "i like you...";
if(character.mood<-2) return "you're distant.";

if(character.attachment>7) return "don't leave.";

return "i'm here.";
}

/* ===== SEND ===== */
function send(){
let text=messageInput.value.trim();
if(!text)return;

addMessage("You",text);
analyze(text);

setTimeout(()=>{
let r=aiResponse(text);
addMessage(character.name,r);
},400);

messageInput.value="";
}

sendBtn.onclick=send;

messageInput.addEventListener("keypress",e=>{
if(e.key==="Enter") send();
});

</script>
</body>
