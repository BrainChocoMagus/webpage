<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Discord Ghosts :: A Digital Haunting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* avoid accidental text selection on drag, but keep readable */
        }

        body {
            background: #1a1b26;
            font-family: 'Segoe UI', 'Whitney', 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Discord-like main layout */
        .app-container {
            width: 1400px;
            max-width: 98vw;
            height: 95vh;
            max-height: 95vh;
            background: #1e1f2c;
            border-radius: 20px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
        }

        /* LEFT SIDEBAR (Servers/DM list) */
        .sidebar-server {
            width: 72px;
            background: #111214;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 12px;
            overflow-y: auto;
            border-right: 1px solid #1e1f2c;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background: #2c2d3a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
            color: #dbdee1;
            font-weight: bold;
            font-size: 1.3rem;
            background: #2b2d3a;
        }

        .server-icon.active {
            border-radius: 16px;
            background: #5865f2;
            color: white;
        }

        .server-icon:hover {
            border-radius: 16px;
            background: #3b3f5c;
        }

        /* CHANNEL SIDEBAR */
        .channel-sidebar {
            width: 240px;
            background: #1e1f2c;
            display: flex;
            flex-direction: column;
            padding: 16px 8px;
            border-right: 1px solid #2b2d3a;
            overflow-y: auto;
        }

        .channel-category {
            font-size: 12px;
            font-weight: 600;
            color: #8e9297;
            margin: 16px 0 4px 8px;
            letter-spacing: 0.5px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 8px;
            margin: 2px 0;
            border-radius: 8px;
            color: #96989d;
            cursor: pointer;
            transition: 0.1s;
            font-size: 15px;
        }

        .channel-item:hover {
            background: #2c2e3a;
            color: #dbdee1;
        }

        .channel-item.active {
            background: #393c49;
            color: white;
        }

        /* MAIN CHAT AREA */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #313338;
            overflow: hidden;
        }

        /* Chat header */
        .chat-header {
            height: 56px;
            background: #2b2d31;
            border-bottom: 1px solid #1e1f22;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
        }

        .channel-info {
            display: flex;
            align-items: baseline;
            gap: 6px;
            color: white;
            font-weight: 600;
        }

        .hash {
            color: #8e9297;
            font-size: 20px;
        }

        .controls {
            display: flex;
            gap: 12px;
            background: #1e1f22;
            padding: 6px 12px;
            border-radius: 24px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #dbdee1;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 12px;
            transition: 0.1s;
            font-weight: 500;
        }

        .control-btn:hover {
            background: #3b3f5c;
        }

        /* messages container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #313338;
        }

        /* message bubbles style (discord-like) */
        .message {
            display: flex;
            flex-direction: column;
            animation: fadeSlide 0.2s ease-out;
            transition: all 0.1s;
        }

        .message.system {
            align-items: center;
            opacity: 0.7;
            font-style: italic;
            font-size: 13px;
            color: #a5a9b0;
            margin: 8px 0;
        }

        .message-row {
            display: flex;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: #5865f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .username {
            font-weight: 600;
            color: white;
            font-size: 15px;
        }

        .timestamp {
            font-size: 11px;
            color: #8e9297;
        }

        .message-text {
            color: #dbdee1;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
            background: transparent;
            transition: all 0.2s;
        }

        /* WOBBLY effect (will be applied via JS toggle) */
        .wobbly-text .message-text {
            display: inline-block;
            animation: wobble 0.5s infinite ease;
        }

        @keyframes wobble {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            25% { transform: translate(1px, -0.5px) rotate(0.4deg); }
            50% { transform: translate(-1px, 1px) rotate(-0.3deg); }
            75% { transform: translate(0.5px, -0.7px) rotate(0.2deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }

        /* zoom level classes */
        .zoom-small .message-text { font-size: 12px; }
        .zoom-normal .message-text { font-size: 15px; }
        .zoom-large .message-text { font-size: 20px; }
        .zoom-xlarge .message-text { font-size: 26px; }

        /* input area */
        .chat-input-area {
            background: #2b2d31;
            padding: 12px 20px;
            border-top: 1px solid #1e1f22;
        }

        .input-wrapper {
            background: #383a40;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 8px;
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        #messageInput::placeholder {
            color: #949ba4;
        }

        .send-btn {
            background: #5865f2;
            border: none;
            color: white;
            border-radius: 20px;
            padding: 6px 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }

        .send-btn:hover {
            background: #4752c4;
        }

        /* color selectors */
        .color-palette {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-end;
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.1s;
        }

        .color-dot.active {
            border-color: white;
            transform: scale(1.1);
        }

        /* scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1f22;
        }

        ::-webkit-scrollbar-thumb {
            background: #2c2f36;
            border-radius: 10px;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ghost-effect {
            opacity: 0.5;
            transition: 0.4s;
            filter: blur(0.6px);
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- server bar (discord leftmost) -->
    <div class="sidebar-server">
        <div class="server-icon active">💔</div>
        <div class="server-icon">✨</div>
        <div class="server-icon">🌙</div>
    </div>

    <!-- channel list -->
    <div class="channel-sidebar">
        <div class="channel-category">TEXT CHANNELS</div>
        <div class="channel-item active" data-channel="general"># 💬  ghost-diaries</div>
        <div class="channel-item" data-channel="memories"># 📔  echoes</div>
        <div class="channel-category">DIRECT MESSAGES</div>
        <div class="channel-item">✨ @stargazer</div>
        <div class="channel-item">🌊 @wave_so_long</div>
    </div>

    <!-- main chat area -->
    <div class="chat-main" id="chatMain">
        <div class="chat-header">
            <div class="channel-info">
                <span class="hash">#</span>
                <span>ghost-diaries · the weight of silence</span>
            </div>
            <div class="controls">
                <button class="control-btn" id="zoomToggleBtn">🔍 Zoom: Normal</button>
                <button class="control-btn" id="wobbleToggleBtn">🌀 Wobble: OFF</button>
                <div class="color-palette" id="colorPalette">
                    <div class="color-dot" style="background: #dbdee1;" data-color="default"></div>
                    <div class="color-dot" style="background: #faa81a;" data-color="#faa81a"></div>
                    <div class="color-dot" style="background: #eb6f9e;" data-color="#eb6f9e"></div>
                    <div class="color-dot" style="background: #6bc9ff;" data-color="#6bc9ff"></div>
                    <div class="color-dot" style="background: #a3e4a1;" data-color="#a3e4a1"></div>
                </div>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <!-- dynamic messages will appear here -->
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Type your reply or experience...">
                <button class="send-btn" id="sendMsgBtn">Send</button>
            </div>
            <div style="font-size: 11px; color:#6d6f78; margin-top: 6px; text-align: right;">✦ ghosting narrative — every message changes the story</div>
        </div>
    </div>
</div>

<script>
    // ------------------- NARRATIVE ARCHITECTURE ------------------
    // A story about online relationship, ghosting, hope and sorrow.
    // The AI "basic response" simulates a partner that fades away.
    
    let step = 0;
    let ghostingActive = false;      // once ghosting starts -> bool prevents further "real" human-like depth?
    let ghostCounter = 0;
    
    // DOM Elements
    const msgContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendMsgBtn');
    const zoomToggleBtn = document.getElementById('zoomToggleBtn');
    const wobbleToggleBtn = document.getElementById('wobbleToggleBtn');
    const chatMainDiv = document.getElementById('chatMain');
    
    // State for zoom levels
    let zoomLevel = 1; // 0:small 1:normal 2:large 3:xlarge
    const zoomClasses = ['zoom-small', 'zoom-normal', 'zoom-large', 'zoom-xlarge'];
    let currentZoomClass = 'zoom-normal';
    
    let wobbleEnabled = false;
    let currentTextColor = '#dbdee1'; // default discord text
    
    // helper: apply zoom
    function applyZoom() {
        msgContainer.classList.remove(...zoomClasses);
        msgContainer.classList.add(currentZoomClass);
        const zoomNames = ['Small', 'Normal', 'Large', 'XLarge'];
        zoomToggleBtn.innerText = `🔍 Zoom: ${zoomNames[zoomLevel]}`;
    }
    
    function nextZoom() {
        zoomLevel = (zoomLevel + 1) % 4;
        currentZoomClass = zoomClasses[zoomLevel];
        applyZoom();
    }
    
    // Toggle wobbliness
    function toggleWobble() {
        wobbleEnabled = !wobbleEnabled;
        if (wobbleEnabled) {
            msgContainer.classList.add('wobbly-text');
            wobbleToggleBtn.innerText = '🌀 Wobble: ON';
        } else {
            msgContainer.classList.remove('wobbly-text');
            wobbleToggleBtn.innerText = '🌀 Wobble: OFF';
        }
    }
    
    // Change message color globally (affects all message-text elements dynamically)
    function setChatColor(color) {
        currentTextColor = color;
        const allMessagesText = document.querySelectorAll('.message-text');
        allMessagesText.forEach(el => {
            el.style.color = color;
        });
        // also future messages will adopt this color via renderMessage
    }
    
    // core rendering of a message (supports normal user, system, or "partner"/ai)
    function addMessage(username, text, isSystem = false, isPartnerGhost = false, timestamp = null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message';
        if (isSystem) messageDiv.classList.add('system');
        
        const time = timestamp ? timestamp : new Date().toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
        
        if (isSystem) {
            messageDiv.innerHTML = `<div class="message-text" style="color: #a5a9b0; text-align:center;">${text}  —  ${time}</div>`;
        } else {
            const avatarSymbol = username === 'You' ? '🐱' : (username === '☁️ starlight' ? '🌙' : '👻');
            const avatarBg = username === 'You' ? '#4e5058' : (username === '☁️ starlight' ? '#9b59b6' : '#2c2f36');
            messageDiv.innerHTML = `
                <div class="message-row">
                    <div class="avatar" style="background: ${avatarBg};">${avatarSymbol}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="username">${username}</span>
                            <span class="timestamp">${time}</span>
                        </div>
                        <div class="message-text" style="color: ${currentTextColor};">${escapeHtml(text)}</div>
                    </div>
                </div>
            `;
        }
        msgContainer.appendChild(messageDiv);
        // auto-scroll to bottom
        msgContainer.scrollTop = msgContainer.scrollHeight;
        
        // if ghosting effect after ghostingActive, we sometimes add extra system flavor
        return messageDiv;
    }
    
    // helper escape
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // basic AI response that simulates "partner with fading interest / ghosting"
    function getAIResponse(userMessage) {
        // phase 0: before ghost - warm and engaged
        if (!ghostingActive) {
            const warmReplies = [
                "💖 heyy sorry for late reply! i was just thinking about you. your messages always make me smile~",
                "🌙 i love talking to you. it feels like we've known each other forever, y'know?",
                "✨ that's so sweet... i wish we could meet irl someday. you get me.",
                "💫 sometimes i feel like you're my digital soulmate. don't disappear on me, okay?",
                "🌸 your good morning texts are everything. i'm glad we found each other."
            ];
            const randomWarm = warmReplies[Math.floor(Math.random() * warmReplies.length)];
            return { text: randomWarm, ghostTrigger: false };
        } else {
            // ghost active: replies become cold, distant, or plain ignoring context
            ghostCounter++;
            const ghostReplies = [
                "oh... yeah.. sorry i've been busy lately.",
                "hey. sorry i didn't reply sooner. just a lot going on.",
                "mm. i see. anyway, gtg maybe talk later?",
                "...",
                "i don't know what to say anymore. things feel different.",
                "i think we need some space. i'm not sure about this.",
                "👻",
                "seen 4h ago",
                "i'm gonna take a break from discord for a while. take care."
            ];
            let reply = ghostReplies[Math.floor(Math.random() * ghostReplies.length)];
            if (ghostCounter > 3 && Math.random() > 0.6) {
                reply = "(no response... still offline)";
            }
            if (ghostCounter > 6) {
                reply = "⚠️ user has not been active for days. message may be ignored.";
            }
            return { text: reply, ghostTrigger: true };
        }
    }
    
    // NARRATIVE INITIATION: intro story that sets the vibe
    function initNarrative() {
        addMessage("☁️ starlight", "hey! i love your vibe. you seem so genuine ✨", false, false, "8:42 PM");
        addMessage("☁️ starlight", "i've never clicked with someone this fast online... it's kinda scary but exciting 💕", false, false, "8:44 PM");
        addMessage("You", "same here!! you're really special, i love our late night talks.", false, false, "8:46 PM");
        addMessage("☁️ starlight", "promise you won't ghost me? everyone leaves eventually..", false, false, "8:49 PM");
        addMessage("You", "never. i'd never ghost you, starlight. 💫", false, false, "8:50 PM");
        addMessage(null, "💬 The connection felt electric — but something was stirring beneath the surface.", true, false, "9:01 PM");
    }
    
    // user sends a message -> advanced response mechanic
    function onUserMessage(rawMessage) {
        if (!rawMessage.trim()) return;
        const userText = rawMessage.trim();
        // add User message
        addMessage("You", userText, false, false);
        messageInput.value = '';
        
        // after user's message, trigger AI partner response with narrative delay
        setTimeout(() => {
            if (!ghostingActive && step === 0) {
                // first few user messages? we track step steps: gradual ghosting trigger based on message count? 
                // narrative logic: after 3 user messages or certain keywords? But we create emotional ghost trigger.
                // we'll use a ghost threshold: if ghostingActive false, but some "distance" will be triggered automatically after the 2nd user message?
                // using a step counter that increments. after a certain number of human messages, ghost starts.
                step++;
                if (step >= 3 && !ghostingActive) {
                    ghostingActive = true;
                    addMessage(null, "⚠️ Something shifted. replies become slower, colder. The warmth fades...", true, false);
                    addMessage("☁️ starlight", "hey... sorry i was busy. what's up?", false, false);
                } else {
                    // normal AI
                    const ai = getAIResponse(userText);
                    addMessage("☁️ starlight", ai.text, false, false);
                    // subtle trigger: if user sends sad messages like "ghost", accelerate
                    if (userText.toLowerCase().includes('ghost') || userText.toLowerCase().includes('leave') || userText.toLowerCase().includes('ignored')) {
                        if (!ghostingActive) {
                            ghostingActive = true;
                            addMessage(null, "💔 you felt the distance growing. the silence begins...", true, false);
                            addMessage("☁️ starlight", "i... i need some time alone. sorry.", false, false);
                        }
                    }
                }
            } 
            else if (ghostingActive) {
                // ghosting phase: AI increasingly cold, maybe ignoring some messages completely
                const ghostResponse = getAIResponse(userText);
                addMessage("☁️ starlight", ghostResponse.text, false, false);
                if (ghostCounter > 5 && Math.random() < 0.4) {
                    addMessage(null, "⏳ last online: 3 days ago — your messages left on read.", true, false);
                }
                if (ghostCounter > 8) {
                    addMessage(null, "💀 They have disappeared completely. You're talking to a memory now.", true, false);
                    // add ghost emoji effect to all previous messages of partner? optional visual
                    const partnerMsgs = document.querySelectorAll('.message .username:contains("☁️ starlight")');
                    // style ghost effect on existing partner messages using class
                    document.querySelectorAll('.message').forEach(msg => {
                        if (msg.innerHTML.includes('☁️ starlight')) {
                            msg.classList.add('ghost-effect');
                        }
                    });
                }
            } else {
                // not ghost but early conversations
                const ai = getAIResponse(userText);
                addMessage("☁️ starlight", ai.text, false, false);
                step++;
            }
        }, 400);
    }
    
    // Additional random ghost event simulation? To make the narrative organic: after some responses, forced ghost trigger
    function narrativeTriggerGhost() {
        if (!ghostingActive && step >= 2) {
            ghostingActive = true;
            addMessage(null, "😶  ⌈ GHOSTING BEGINS ⌋  messages become shorter, replies stretched into days...", true, false);
            addMessage("☁️ starlight", "i need to focus on irl stuff. don't wait for me.", false, false);
        }
    }
    
    // reset story for replay? (secret double click on logo? but we allow simple reinit with 'reset' easter egg)
    function resetStory() {
        msgContainer.innerHTML = '';
        step = 0;
        ghostingActive = false;
        ghostCounter = 0;
        currentTextColor = '#dbdee1';
        setChatColor('#dbdee1');
        document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
        const defaultDot = document.querySelector('.color-dot[data-color="default"]');
        if(defaultDot) defaultDot.classList.add('active');
        initNarrative();
        addMessage(null, "✨ The story resets. every connection holds the risk of a ghost. maybe this time...? ✨", true, false);
    }
    
    // ----------- event listeners plus color dots -------------
    sendBtn.addEventListener('click', () => {
        const val = messageInput.value;
        if(val.trim()) onUserMessage(val);
    });
    messageInput.addEventListener('keypress', (e) => {
        if(e.key === 'Enter') {
            e.preventDefault();
            const val = messageInput.value;
            if(val.trim()) onUserMessage(val);
        }
    });
    
    zoomToggleBtn.addEventListener('click', nextZoom);
    wobbleToggleBtn.addEventListener('click', toggleWobble);
    
    // color management
    const colorDots = document.querySelectorAll('.color-dot');
    colorDots.forEach(dot => {
        dot.addEventListener('click', () => {
            colorDots.forEach(d => d.classList.remove('active'));
            dot.classList.add('active');
            let colorVal = dot.getAttribute('data-color');
            if(colorVal === 'default') colorVal = '#dbdee1';
            setChatColor(colorVal);
        });
    });
    // set default active color
    document.querySelector('.color-dot[data-color="default"]').classList.add('active');
    
    // optional: long ghost simulation: after 30 seconds without sending? but not needed.
    // Add an element to allow reset with console or double click header?
    const headerChannel = document.querySelector('.channel-info');
    headerChannel.addEventListener('dblclick', () => {
        resetStory();
    });
    
    // Also channel selector just for mood, but primary channel - ghost diaries - but we also support other channels to keep illusion. similiar to social media
    document.querySelectorAll('.channel-item').forEach(ch => {
        ch.addEventListener('click', (e) => {
            document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
            ch.classList.add('active');
            const channelName = ch.innerText;
            if(channelName.includes('echoes')) {
                addMessage(null, "📜 Echoes of past conversations flicker like half-remembered dreams.", true, false);
                addMessage(null, "✦ you see a faint message: 'i'll never ghost you' ... but the user is gone.", true, false);
            } else if(channelName.includes('ghost-diaries')) {
                addMessage(null, "💬 Welcome back to the ghost-diaries. Your story continues here.", true, false);
            }
        });
    });
    
    // optional AI prefix? implemented
    
    // start the game
    initNarrative();
    
    // after 20 seconds automatically if no ghost, trigger ghost slowly to emulate real-world pressure
    setTimeout(() => {
        if(!ghostingActive && step <= 1) {
            addMessage(null, "🌫️ A cold wind drifts through the chat. The connection feels fragile.", true, false);
        }
    }, 15000);
    
    // force ghost delay to create tension but only if user hasn't triggered yet (20k)
    setTimeout(() => {
        if(!ghostingActive && step > 0) {
            narrativeTriggerGhost();
        }
    }, 45000);
</script>
</body>
</html>
