<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✦ Archivo Personal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== BARRA DE NAVEGACIÓN ===== -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="../" class="home-link">⌂ Inicio</a>
            <h1 class="site-title">✦ Archivo</h1>
        </div>
        <div class="nav-right">
            <button onclick="mostrarTodos()" class="btn btn-outline">✦ Todos</button>
            <button id="toggleTags" class="btn btn-outline">✦ Constelaciones</button>
            <button onclick="toggleModoLectura()" class="btn btn-outline" id="modoLecturaBtn">📖 Modo Lectura</button>
        </div>
    </nav>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <div class="main-container">
        <!-- Panel Izquierdo: Lista de posts -->
        <aside class="sidebar">
            <div class="filter-section">
                <div id="activeFilter" class="active-filter" style="display:none;"></div>
                <div class="date-filters">
                    <button onclick="filtrarPorFecha('2025')" class="btn btn-sm">2025</button>
                    <button onclick="filtrarPorFecha('2026')" class="btn btn-sm">2026</button>
                    <button onclick="filtrarPorFecha('2027')" class="btn btn-sm">2027</button>
                </div>
                <!-- Barra de búsqueda -->
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Buscar posts..." oninput="buscarPosts(this.value)">
                    
                </div>
            </div>
            <div id="list" class="post-list"></div>
        </aside>

        <!-- Panel Derecho: Contenido del post -->
        <main class="content">
            <article id="post" class="post-content">
                <div class="welcome-message">
                    <p>✦ selecciona un post para leer ✦</p>
                </div>
            </article>
        </main>
    </div>

    <!-- ===== CONSTELACIÓN DE TAGS ===== -->
    <div id="tags" class="tags-constellation"></div>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>✦ Archivo personal — <span id="postCount">0</span> entradas</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
